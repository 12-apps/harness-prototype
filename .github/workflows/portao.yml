name: portão

# O portão sai diferente de zero quando o protótipo não cumpre a própria
# especificação. Rodar no CI é o que impede um protótipo quebrado de virar
# a fonte de verdade de quem for implementar.
#
# O runner do GitHub já traz Chromium, então aqui valem TAMBÉM as regras
# que precisam medir caixa: arranjo por degrau, transbordo, alvo de toque,
# tamanho de texto e comprimento de linha. Localmente, sem navegador, essas
# se declaram não verificáveis — a saída marca `[navegador]` quando valeram.

on:
  push:
    branches: [main]
  pull_request:

# O portão só lê o repositório: clona, instala jsdom e roda a suíte.
# Sem isto o GITHUB_TOKEN entra com as permissões padrão do repositório,
# que são mais amplas do que qualquer passo aqui precisa.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # O portão só entra no navegador quando acha um Chromium E o puppeteer
      # para dirigi-lo; sem o puppeteer ele cai no jsdom em silêncio, e as
      # regras de medida deixam de valer sem que a saída reclame.
      - name: instalar as dependências do portão
        run: npm install --no-save jsdom puppeteer
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'   # o runner já traz o Chrome achado abaixo

      - name: localizar o Chromium do runner
        id: chrome
        run: |
          for c in "$CHROME_BIN" /usr/bin/google-chrome /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -n "$c" ] && [ -x "$c" ]; then echo "caminho=$c" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "caminho=" >> "$GITHUB_OUTPUT"

      - name: verificar o harness e os exemplos
        env:
          PALADIRA_CHROME: ${{ steps.chrome.outputs.caminho }}
        run: |
          falhou=0
          for f in paladira-harness.html exemplos/*.html; do
            [ -e "$f" ] || continue
            echo "── $f"
            node paladira-verificar.js "$f" || falhou=1
          done
          exit $falhou
